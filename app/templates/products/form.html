<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ShopTrack - {{ "Edit" if product else "Add" }} product</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container mt-4" style="max-width: 32rem">
        <h1 class="h3 mb-3">{{ "Edit product" if product else "Add product" }}</h1>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
          {% endfor %}
        {% endwith %}

        <form method="POST" class="card card-body shadow-sm">
            <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input id="name" name="name" class="form-control" required
                       value="{{ form.get('name') or (product.name if product else '') }}">
            </div>
            <div class="mb-3">
                <label for="price" class="form-label">Price</label>
                <input id="price" name="price" type="number" step="0.01" min="0.01" class="form-control" required
                       value="{{ form.get('price') or (product.price if product else '') }}">
            </div>
            <div class="mb-3">
                <label for="reorder_level" class="form-label">Reorder level (alert when stock falls to this)</label>
                <input id="reorder_level" name="reorder_level" type="number" min="0" class="form-control" required
                       value="{{ form.get('reorder_level') or (product.reorder_level if product else 5) }}">
            </div>
            <div class="d-flex gap-2">
                <button class="btn btn-primary">Save</button>
                <a href="{{ url_for('products.index') }}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
