<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ShopTrack - Create owner account</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 24rem">
        <h1 class="h3 mb-1">Welcome to ShopTrack</h1>
        <p class="text-muted">Create the shop owner's account. Staff accounts are added later from the dashboard.</p>
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
          {% endfor %}
        {% endwith %}
        <form method="POST" class="card card-body shadow-sm">
            <div class="mb-3">
                <label for="username" class="form-label">Owner username</label>
                <input id="username" name="username" class="form-control" required autofocus>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password (at least 6 characters)</label>
                <input id="password" name="password" type="password" minlength="6" class="form-control" required>
            </div>
            <button class="btn btn-primary">Create owner account</button>
        </form>
    </div>
</body>
</html>
